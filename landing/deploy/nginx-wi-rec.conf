server {
    listen 80;
    server_name wi-rec.williamache.dev;
    root /var/www/wiarch/wi-rec;
    index index.html;

    location /downloads/ {
        alias /var/www/wiarch/wi-rec/downloads/;
        add_header Content-Disposition attachment;
        add_header Cache-Control "public, max-age=3600";
    }

    location /_expo/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
