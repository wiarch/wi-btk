<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WI Widget</title>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <div id="root" class="widget theme-glass" data-type="clock">
      <header class="drag">
        <strong id="title">Widget</strong>
        <div class="controls">
          <button type="button" id="close-btn" title="Cerrar">✕</button>
        </div>
      </header>
      <main id="body" class="body"></main>
      <div class="resize" aria-hidden="true"></div>
    </div>
    <script type="module" src="widget.js"></script>
  </body>
</html>
