<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WI-Rec Color Picker</title>
    <link rel="stylesheet" href="colorPicker.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="cursor-preview" class="cursor-preview hidden" aria-hidden="true">
      <span id="cursor-swatch" class="cursor-swatch"></span>
      <span id="cursor-hex" class="cursor-hex">#000000</span>
    </div>
    <div id="panel" class="panel hidden" role="dialog" aria-hidden="true">
      <header class="panel-titlebar">
        <h2 id="panel-title" class="panel-title">WI-Rec (Color Picker)</h2>
        <div class="window-controls">
          <button type="button" id="minimize-btn" class="win-btn win-minimize" title="Minimize">─</button>
          <button type="button" id="maximize-btn" class="win-btn win-maximize" title="Maximize">□</button>
          <button type="button" id="close-btn" class="win-btn win-close" title="Close">✕</button>
        </div>
      </header>

      <div class="panel-body">
      <div class="picker-area">
        <div class="sv-wrap">
          <canvas id="sv-canvas" width="280" height="140"></canvas>
          <div id="sv-handle" class="picker-handle" aria-hidden="true"></div>
        </div>
        <input id="hue-slider" class="hue-slider" type="range" min="0" max="360" value="0" />
      </div>

      <div class="format-field format-hex">
        <span class="format-label">HEX</span>
        <div class="format-box hex-box">
          <span id="hex-swatch" class="hex-swatch"></span>
          <input id="hex-input" type="text" spellcheck="false" maxlength="7" />
          <button type="button" id="copy-hex-btn" class="copy-icon-btn" title="Copy">⧉</button>
        </div>
      </div>
      <div class="format-grid">
        <div class="format-field">
          <span class="format-label">RGB</span>
          <div class="format-box">
            <input id="rgb-input" type="text" spellcheck="false" />
          </div>
        </div>
        <div class="format-field">
          <span class="format-label">CMYK</span>
          <div class="format-box">
            <input id="cmyk-input" type="text" spellcheck="false" />
          </div>
        </div>
        <div class="format-field">
          <span class="format-label">HSV</span>
          <div class="format-box">
            <input id="hsv-input" type="text" spellcheck="false" />
          </div>
        </div>
        <div class="format-field">
          <span class="format-label">HSL</span>
          <div class="format-box">
            <input id="hsl-input" type="text" spellcheck="false" />
          </div>
        </div>
      </div>

      <section class="variations-basic">
        <h3 id="variations-title" class="variations-title"></h3>
        <div id="variation-strip" class="variation-strip"></div>
      </section>

      <button type="button" id="advanced-toggle" class="advanced-toggle" aria-expanded="false"></button>

      <div id="advanced-section" class="advanced-section hidden" aria-hidden="true">
        <section class="adv-block">
          <h3 id="harmonies-title" class="adv-title"></h3>
          <div id="harmonies" class="adv-groups"></div>
        </section>

        <section class="adv-block">
          <h3 id="conversions-title" class="adv-title"></h3>
          <div class="conversion-grid">
            <div class="conversion-row"><span>XYZ</span><code id="xyz-value">—</code></div>
            <div class="conversion-row"><span>Lab</span><code id="lab-value">—</code></div>
          </div>
        </section>

        <section class="adv-block">
          <h3 id="contrast-title" class="adv-title"></h3>
          <div id="contrast-checker" class="contrast-grid"></div>
        </section>

        <section class="adv-block">
          <h3 id="similar-title" class="adv-title"></h3>
          <div id="similar-colors" class="similar-grid"></div>
        </section>
      </div>

      <p id="hint" class="hint"></p>
      </div>
    </div>
    <p id="pick-hint" class="pick-hint"></p>
    <script type="module" src="colorPicker.js"></script>
  </body>
</html>
