<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WI-Print Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <h1 id="title">Settings</h1>
          <p id="subtitle" class="subtitle">Hotkeys, startup and language</p>
        </div>
      </header>

      <section class="card">
        <h2 id="general-title">General</h2>
        <div class="field">
          <label id="language-label" for="language">Language</label>
          <select id="language">
            <option value="en">English</option>
            <option value="es">Spanish</option>
          </select>
        </div>
        <label class="checkbox-row">
          <input id="launch-at-startup" type="checkbox" />
          <span id="launch-label">Launch at system startup</span>
        </label>
      </section>

      <section class="card">
        <h2 id="hotkeys-title">Hotkeys</h2>
        <p id="hotkeys-hint" class="hint">Click a field and press the desired key combination.</p>
        <h3 id="global-hotkeys-title" class="section-label">Global</h3>
        <div class="hotkey-grid" id="global-hotkey-grid"></div>
        <h3 id="capture-hotkeys-title" class="section-label">In capture overlay</h3>
        <div class="hotkey-grid" id="overlay-hotkey-grid"></div>
      </section>

      <footer class="footer">
        <button type="button" id="cancel-btn" class="btn secondary">Cancel</button>
        <button type="button" id="save-btn" class="btn primary">Save</button>
      </footer>

      <p id="status" class="status" aria-live="polite"></p>
    </div>
    <script type="module" src="settings.js"></script>
  </body>
</html>
